services:
  - type: web
    name: salla-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_TOKEN
        sync: false
      - key: STORE1_NAME
        value: "مايكرو"
      - key: STORE1_ACCESS_TOKEN
        sync: false
      - key: STORE2_NAME
        value: "بيرق"
      - key: STORE2_ACCESS_TOKEN
        sync: false
      - key: STORE3_NAME
        value: "الشاهين"
      - key: STORE3_ACCESS_TOKEN
        sync: false
      - key: STORE4_NAME
        value: "زمرد"
      - key: STORE4_ACCESS_TOKEN
        sync: false
